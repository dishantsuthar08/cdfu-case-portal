<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log In — Cyber Detective Files</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/main.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg cdfu-nav">
  <div class="container">
    <a class="navbar-brand" href="index.html"><span class="brand-mark">CD</span>Cyber Detective Files</a>
  </div>
</nav>

<section class="section">
  <div class="container" style="max-width: 460px;">
    <div class="text-center mb-4">
      <span class="folder-tag">● Bureau Access</span>
      <h1 class="h3 mt-2">Log In</h1>
      <p class="text-dim small">Enter your Bureau credentials to resume open cases.</p>
    </div>
    <div class="paper-panel">
      <form id="login-form">
        <div class="mb-3">
          <label for="email">Email</label>
          <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-3">
          <label for="password">Password</label>
          <input type="password" class="form-control" id="password" required>
        </div>
        <div id="login-error" class="small mb-3" style="color:var(--stamp-red); display:none;"></div>
        <button type="submit" class="btn-stamp btn-stamp-gold w-100">Log In</button>
      </form>
      <div class="divider-dash"></div>
      <p class="text-center small mb-0" style="color:var(--ink-soft);">No Badge ID yet? <a href="signup.html">Join the Bureau</a></p>
    </div>
  </div>
</section>

<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script>
  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const res = await login({ email, password });
    const errEl = document.getElementById("login-error");
    if (!res.ok) {
      errEl.textContent = res.error;
      errEl.style.display = "block";
      return;
    }
    const next = new URLSearchParams(location.search).get("next");
    window.location.href = next || "profile.html";
  });
</script>
</body>
</html>
