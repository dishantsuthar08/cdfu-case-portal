<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="page-title">Evidence Folder — Cyber Detective Files</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/main.css" rel="stylesheet">
</head>
<body class="reader-shell">

<div class="reader-topbar">
  <div class="d-flex align-items-center gap-3">
    <a href="index.html" class="btn-file">← Portal</a>
    <span class="title" id="reader-case-title">Loading case…</span>
  </div>
  <div class="d-flex align-items-center gap-2">
    <button id="prev-btn" class="btn-file" type="button">← Prev</button>
    <span class="title text-data" id="page-indicator">–</span>
    <button id="next-btn" class="btn-file" type="button">Next →</button>
    <a id="back-to-case" href="cases.html" class="btn-stamp btn-stamp-gold">Back to Case →</a>
  </div>
</div>

<div class="container-fluid reader-frame-wrap">
  <div class="row">
    <div class="col-lg-3 col-xl-2 d-none d-lg-block">
      <div class="panel reader-nav-list" id="page-list" style="margin: 0 0 0 1rem;"></div>
    </div>
    <div class="col-lg-9 col-xl-10">
      <iframe id="reader-frame" class="reader-frame" title="Evidence sheet"></iframe>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script>
(async () => {
  const caseId = new URLSearchParams(location.search).get("case");
  const frame = document.getElementById("reader-frame");
  const indicator = document.getElementById("page-indicator");
  const pageList = document.getElementById("page-list");
  document.getElementById("back-to-case").href = `case.html?id=${caseId}`;

  let c = null;
  try {
    const data = await api(`/api/cases/${encodeURIComponent(caseId)}`);
    c = data.case;
  } catch {
    c = null;
  }

  if (!c || c.locked || !c.folder) {
    document.title = "File unavailable — Cyber Detective Files";
    document.getElementById("reader-case-title").textContent = "This evidence folder isn't available yet.";
    document.getElementById("prev-btn").disabled = true;
    document.getElementById("next-btn").disabled = true;
  } else {
    document.title = `${c.title} — Evidence Folder`;
    document.getElementById("reader-case-title").textContent = `${c.code} — ${c.title}`;
    document.getElementById("page-title").textContent = `${c.title} — Evidence Folder`;

    // pages[0] is the table of contents (c.cover); pages 1..N are page-01.html.. etc.
    const pages = [{ label: "Table of Contents", file: c.folder + c.cover }];
    for (let i = 1; i <= c.pageCount; i++) {
      const num = String(i).padStart(2, "0");
      pages.push({ label: `Page ${num}`, file: `${c.folder}page-${num}.html` });
    }

    let current = 0;

    function show(i) {
      current = Math.max(0, Math.min(pages.length - 1, i));
      frame.src = pages[current].file;
      indicator.textContent = `${current + 1} / ${pages.length}`;
      document.querySelectorAll("#page-list a").forEach((a, idx) => {
        a.classList.toggle("active", idx === current);
      });
    }

    pageList.innerHTML = pages
      .map(
        (p, i) => `<a href="#" data-i="${i}"><span>${p.label}</span></a>`
      )
      .join("");
    pageList.querySelectorAll("a").forEach((a) => {
      a.addEventListener("click", (e) => {
        e.preventDefault();
        show(Number(a.dataset.i));
      });
    });

    document.getElementById("prev-btn").addEventListener("click", () => show(current - 1));
    document.getElementById("next-btn").addEventListener("click", () => show(current + 1));

    show(0);
  }
})();
</script>
</body>
</html>
