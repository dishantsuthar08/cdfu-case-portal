<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel — Cyber Detective Files</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/main.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg cdfu-nav sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html"><span class="brand-mark">CD</span>Cyber Detective Files</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto ms-lg-4">
        <li class="nav-item"><a class="nav-link" data-nav="index.html" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" data-nav="cases.html" href="cases.html">Case Files</a></li>
        <li class="nav-item"><a class="nav-link" data-nav="leaderboard.html" href="leaderboard.html">Bureau Rankings</a></li>
        <li class="nav-item"><a class="nav-link" data-nav="badges.html" href="badges.html">Evidence Stamps</a></li>
        <li class="nav-item"><a class="nav-link active" data-nav="admin.html" href="admin.html">Admin</a></li>
      </ul>
      <div class="d-flex align-items-center gap-2 mt-3 mt-lg-0" id="nav-session-slot"></div>
    </div>
  </div>
</nav>

<div id="admin-root"></div>

<footer class="cdfu-footer">
  <div class="container d-flex flex-wrap justify-content-between gap-3">
    <div>Cyber Detective Files — Case Portal · Admin Panel.</div>
    <div>© <span id="footer-year"></span> CDFU</div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/admin.js"></script>
<script>
(async () => {
  const u = await requireAuth();
  if (!u) return; // requireAuth() already redirected to login

  renderNavSession(u);
  setActiveNav();
  setFooterYear();
  await loadRanks();

  const root = document.getElementById("admin-root");

  if (!u.isAdmin) {
    root.innerHTML = `
      <div class="container section text-center">
        <h2>Admin access only</h2>
        <p class="text-dim">Your Badge ID (${u.badgeId}) doesn't have Bureau Chief clearance.</p>
        <a href="index.html" class="btn-file">Back to Portal</a>
      </div>`;
    return;
  }

  renderAdminPage(root);
})();
</script>
</body>
</html>
